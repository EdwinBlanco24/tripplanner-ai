AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TripPlanner AI - publicacion del frontend (Vite estatico): bucket S3 privado + CloudFront con Origin Access Control,
  cabeceras de seguridad (CSP, HSTS...) y fallback de SPA. Stack independiente del backend y de AgentCore.

Parameters:
  ApiOrigin:
    Type: String
    Default: https://g636zxc5fi.execute-api.us-east-2.amazonaws.com
    Description: Origen de la API de negocio (API Gateway). Va en connect-src de la CSP.
  AgentCoreOrigin:
    Type: String
    Default: https://bedrock-agentcore.us-east-2.amazonaws.com
    Description: Origen de AgentCore Runtime (streaming del asistente). Va en connect-src de la CSP.
  CognitoOrigin:
    Type: String
    Default: https://cognito-idp.us-east-2.amazonaws.com
    Description: Origen del endpoint de Cognito IDP (login directo). Va en connect-src de la CSP.

Resources:
  # ---------------------------------------------------------------- Bucket privado
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ---------------------------------------------------------------- CloudFront
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Acceso de CloudFront al bucket privado del frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Cache corta para data/* (cities.json cambia rara vez, pero no es un archivo con huella).
  DataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-data-short"
        Comment: data/* con TTL corto (1 h por defecto, maximo 1 dia)
        MinTTL: 0
        DefaultTTL: 3600
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: HSTS, nosniff, X-Frame-Options, Referrer-Policy y CSP
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline';
              font-src 'self' data:;
              img-src 'self' data:;
              connect-src 'self' ${ApiOrigin} ${AgentCoreOrigin} ${CognitoOrigin};
              frame-ancestors 'none';
              base-uri 'self';
              form-action 'self'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: TripPlanner AI - frontend
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        # index.html y config.json: sin cache (managed CachingDisabled).
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CacheBehaviors:
          # Archivos con huella de Vite: cache larga (managed CachingOptimized).
          - PathPattern: /assets/*
            TargetOriginId: frontend-s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          - PathPattern: /data/*
            TargetOriginId: frontend-s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref DataCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        # SPA: una ruta del cliente (p. ej. /viajes/TRP-1) no existe en S3 y devuelve 403/404 -> index.html.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

Outputs:
  BucketName:
    Description: Bucket privado con los archivos del frontend
    Value: !Ref FrontendBucket
  DistributionId:
    Description: Id de la distribucion de CloudFront (para invalidaciones)
    Value: !Ref FrontendDistribution
  DistributionDomainName:
    Description: Dominio de CloudFront
    Value: !GetAtt FrontendDistribution.DomainName
  AppUrl:
    Description: URL de la aplicacion
    Value: !Sub "https://${FrontendDistribution.DomainName}"
