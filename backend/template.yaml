AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TripPlanner AI - backend serverless (Cognito, HTTP API, 4 Lambdas y DynamoDB de tabla unica).

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173"
    Description: Origenes permitidos por CORS (dominio de CloudFront del frontend y localhost en desarrollo).

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref TripPlannerTable

Resources:
  # ------------------------------------------------------------------ DynamoDB (docs/02-modelo-datos.md)
  TripPlannerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: true

  # ------------------------------------------------------------------ Cognito (ADR-04)
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: tripplanner-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tripplanner-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  # ------------------------------------------------------------------ HTTP API (docs/03-api.md)
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: TripPlanner AI - API de negocio (canal 1)
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            # El access token de Cognito no trae "aud": API Gateway valida su claim "client_id" contra "audience".
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 3600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","requestTime":"$context.requestTime","method":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage","authorizerError":"$context.authorizer.error"}'

  # ------------------------------------------------------------------ Lambdas (ADR-02)
  TripsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Viajes (canal 1 por API Gateway y canal 2 por invocacion directa del agente).
      CodeUri: src/
      Handler: trips.app.lambda_handler
      Policies:
        - Statement:
            - Sid: TripPlannerTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        ListTrips:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips
            Method: GET
        CreateTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips
            Method: POST
        GetTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}
            Method: GET
        UpdateTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}
            Method: PUT
        DeleteTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}
            Method: DELETE

  ItinerariesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Itinerarios (canal 1 y canal 2).
      CodeUri: src/
      Handler: itineraries.app.lambda_handler
      Policies:
        - Statement:
            - Sid: TripPlannerTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        GetItinerary:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}/itinerary
            Method: GET
        CreateItinerary:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}/itinerary
            Method: POST
        UpdateItinerary:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}/itinerary
            Method: PUT

  ReservationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Reservas simuladas (canal 1 y canal 2).
      CodeUri: src/
      Handler: reservations.app.lambda_handler
      Policies:
        - Statement:
            - Sid: TripPlannerTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        ListReservations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /reservations
            Method: GET
        CreateReservation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}/reservations
            Method: POST
        GetReservation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}/reservations/{resId}
            Method: GET
        UpdateReservation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}/reservations/{resId}
            Method: PUT
        DeleteReservation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /trips/{tripId}/reservations/{resId}
            Method: DELETE

  PreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Preferencias del usuario (canal 1; acciones reservadas para el canal 2).
      CodeUri: src/
      Handler: preferences.app.lambda_handler
      Policies:
        - Statement:
            - Sid: TripPlannerTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt TripPlannerTable.Arn
      Events:
        GetPreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preferences
            Method: GET
        PutPreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /preferences
            Method: PUT

  # ------------------------------------------------------------------ Logs (retencion 14 dias)
  TripsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TripsFunction}
      RetentionInDays: 14

  ItinerariesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ItinerariesFunction}
      RetentionInDays: 14

  ReservationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ReservationsFunction}
      RetentionInDays: 14

  PreferencesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PreferencesFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: URL base de la API de negocio
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Description: Id del User Pool de Cognito
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Id del app client (sin secreto)
    Value: !Ref UserPoolClient
  JwtIssuer:
    Description: Issuer de los JWT (discoveryUrl = issuer + /.well-known/openid-configuration)
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  TableName:
    Description: Nombre de la tabla DynamoDB
    Value: !Ref TripPlannerTable
  TripsFunctionArn:
    Description: ARN de TripsFunction (permiso lambda:InvokeFunction del Orchestrator)
    Value: !GetAtt TripsFunction.Arn
  ItinerariesFunctionArn:
    Description: ARN de ItinerariesFunction
    Value: !GetAtt ItinerariesFunction.Arn
  ReservationsFunctionArn:
    Description: ARN de ReservationsFunction
    Value: !GetAtt ReservationsFunction.Arn
  PreferencesFunctionArn:
    Description: ARN de PreferencesFunction
    Value: !GetAtt PreferencesFunction.Arn
